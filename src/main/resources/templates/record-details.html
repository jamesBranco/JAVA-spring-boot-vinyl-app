<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Record Details</title>

  <!-- Bootstrap styling to enhance card layout, spacing, and buttons for clean detail page -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!-- Using Bootstrap to apply a Extremely light Blue  -->
<body class="bg-primary-subtle">
<div class="container py-4">

  <h1 class="h3 mb-3">Record Details</h1>

  <div class="card p-3 shadow-sm">
    <p><strong>Title:</strong> <span th:text="${record.title}"></span></p>
    <p><strong>Artist:</strong> <span th:text="${record.artist}"></span></p>
    <p><strong>Label:</strong> <span th:text="${record.label}"></span></p>
    <p><strong>Year Released:</strong> <span th:text="${record.yearReleased}"></span></p>
    <p><strong>Tracks:</strong> <span th:text="${record.numberOfTracks}"></span></p>
    <p><strong>Size:</strong> <span th:text="${record.size}"></span></p>

    <div th:if="${record.damaged}" class="alert alert-warning mt-2">
      Damaged record
    </div>

    <a class="btn btn-secondary mt-2" href="/records">Back</a>
  </div>

</div>
</body>
</html>
